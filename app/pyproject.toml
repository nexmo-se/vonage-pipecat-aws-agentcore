[project]
name = "vonage-pipecat-aws-agentcore-app"
version = "0.1.0"
description = "Real-time AI voice/video agent — Vonage + Pipecat + AWS Nova Sonic + AgentCore"
requires-python = ">=3.11"

dependencies = [
    # Vonage Video API + Video Connector
    "vonage>=4.0.0",
    "vonage-video-connector>=1.0.0",

    # Pipecat AI pipeline framework with AWS + WebRTC extras
    "pipecat-ai[aws,silero,webrtc]>=0.0.50",

    # AWS SDK
    "boto3>=1.34.0",

    # AWS Bedrock AgentCore Runtime
    "bedrock-agentcore>=0.1.0",

    # Web server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
